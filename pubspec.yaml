name: melocue
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.1.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D12"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/
    - assets/images/song_clues/
